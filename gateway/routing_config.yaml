routes:
  - pattern: "claude-*"
    provider: anthropic
    default_model: claude-sonnet-4-6
  - pattern: "gpt-*"
    provider: openai
    default_model: gpt-4o-mini
  - pattern: "nvidia/*"
    provider: openrouter
    default_model: nvidia/llama-3.1-nemotron-70b-instruct
  - pattern: "meta-llama/*"
    provider: openrouter
    default_model: meta-llama/llama-3.1-70b-instruct
  - pattern: "mistralai/*"
    provider: openrouter
    default_model: mistralai/mistral-7b-instruct

default:
  provider: anthropic
  model: claude-sonnet-4-6

fallback:
  provider: openai
  model: gpt-4o-mini

rate_limit_tiers:
  free:
    tokens_per_minute: 500
    tokens_per_day: 10000
    requests_per_minute: 10
  standard:
    tokens_per_minute: 5000
    tokens_per_day: 100000
    requests_per_minute: 60
  premium:
    tokens_per_minute: 50000
    tokens_per_day: 1000000
    requests_per_minute: 300

cost_per_token:
  claude-sonnet-4-6:
    prompt: 0.000003
    completion: 0.000015
  claude-3-5-haiku-20241022:
    prompt: 0.0000008
    completion: 0.000004
  claude-opus-4:
    prompt: 0.000015
    completion: 0.000075
  claude-3-5-sonnet-20241022:
    prompt: 0.000003
    completion: 0.000015
  gpt-4o:
    prompt: 0.0000025
    completion: 0.00001
  gpt-4o-mini:
    prompt: 0.00000015
    completion: 0.0000006
  gpt-4-turbo:
    prompt: 0.00001
    completion: 0.00003
  default:
    prompt: 0.000003
    completion: 0.000015
